[project]
name = "gantry-007-2unit-grblhal-serial"
version = "0.1.0"
description = "Overkill2 (Liquid handling - pipette gantry). 2unit grblHAL gantry 007, serial and WebSocket."
requires-python = ">=3.10"
dependencies = [
    "qubot-geometry",
    "pyserial~=3.5",
    "websocket-client>=1.8.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"



[tool.hatch.build.targets.wheel]
packages = [
    "src/gantry_007",
]
