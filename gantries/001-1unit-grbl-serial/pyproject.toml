[project]
name = "gantry-001-1unit-grbl-serial"
version = "0.1.0"
description = "1unit grbl-serial gantry 001."
requires-python = ">=3.10"
dependencies = [
    "qubot-geometry",
    "pyserial~=3.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"



[tool.hatch.build.targets.wheel]
packages = [
    "src/gantry_001",
]
