[project]
name = "gantry-005-8unit-grblhal-serial"
version = "0.1.0"
description = "Claw machine (Pick-and-place). 8unit grblHAL gantry 005, serial and WebSocket."
requires-python = ">=3.10"
dependencies = [
    "qubot-geometry",
    "pyserial~=3.5",
    "websocket-client>=1.8.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gantry_005",
]
