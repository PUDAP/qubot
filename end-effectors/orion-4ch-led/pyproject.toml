[project]
name = "orion-4ch-led"
version = "0.1.0"
description = "Four-channel Orion's Belt LED board. One 9600 baud serial port."
requires-python = ">=3.10"
dependencies = [
    "pyserial~=3.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/orion_4ch_led",
]
