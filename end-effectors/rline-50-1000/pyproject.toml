[project]
name = "rline-50-1000"
version = "0.1.0"
description = "Sartorius rLine 50-1000 uL pipette body."
requires-python = ">=3.10"
dependencies = [
    "pyserial~=3.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rline_50_1000",
]
