[project]
name = "parallel-force-actuator"
version = "0.1.0"
description = "Four serial force actuators. One port per channel."
requires-python = ">=3.10"
dependencies = [
    "pyserial~=3.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/parallel_force_actuator",
]
