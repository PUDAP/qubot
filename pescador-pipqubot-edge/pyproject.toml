[project]
name = "pescador-pipqubot-edge"
version = "0.1.0"
description = "Edge service for the pescador-pipqubot machine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "qubot-drivers",
    "puda==0.0.16",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "psutil>=6.0.0",
]

[tool.uv.sources]
qubot-drivers = {workspace=true}
