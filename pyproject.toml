[project]
name = "qubot"
version = "0.1.0"
description = "Deployment-independent Qubot gantry and end-effector packages."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/qubot-geometry",
    "packages/qubot-edgekit",
    "gantries/001-1unit-grbl-serial",
    "gantries/002-1unit-reprap-http",
    "gantries/003-2unit-grbl-serial",
    "gantries/004-4unit-reprap-http",
    "gantries/005-8unit-grblhal-serial",
    "gantries/006-1unit-grblhal-serial",
    "gantries/007-2unit-grblhal-serial",
    "gantries/008-1unit-grblhal-serial",
    "gantries/009-1unit-grblhal-serial",
    "end-effectors/rline-50-1000",
    "end-effectors/a-axis-capper",
    "end-effectors/autosampler-syringe",
    "end-effectors/rotating-vacuum-gripper",
    "end-effectors/vacuum-chamber",
    "end-effectors/orion-4ch-led",
]

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.uv.sources]
qubot-geometry = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "end-effectors/autosampler-syringe/tests",
    "end-effectors/rotating-vacuum-gripper/tests",
    "end-effectors/vacuum-chamber/tests",
    "end-effectors/orion-4ch-led/tests",
]
