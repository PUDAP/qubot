[tool.uv.workspace]
members = [
    "edges/first",
    "edges/capper",
    "edges/pescador",
    "edges/pipqubot-mof",
    "edges/pipqubot-xl",
    "edges/pipqubot-v3",
    "edges/miniqubot",
    "edges/syringequbot",
    "driver",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "driver/tests",
    "edges/miniqubot/tests",
    "edges/pipqubot-mof/tests",
    "edges/pipqubot-xl/tests",
    "edges/syringequbot/tests",
]
norecursedirs = ["examples", ".venv", "dist", "build"]
