services:
  capper:
    build:
      context: ..
      dockerfile: capper-edge/Dockerfile
    image: ghcr.io/pudap/capper-edge:latest
    container_name: capper-edge
    restart: unless-stopped
    # Mount host .env so config updates apply after recreate (see main.py Config).
    volumes:
      - ./.env:/app/capper-edge/.env:ro
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
