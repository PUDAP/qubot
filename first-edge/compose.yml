services:
  first:
    build:
      context: ..
      dockerfile: first-edge/Dockerfile
    image: ghcr.io/pudap/first-edge:latest
    container_name: first-edge
    restart: unless-stopped
    # Mount USB devices for serial communication
    # Note: Device paths should match QUBOT_PORT and SATORIUS_PORT env vars
    devices:
      - ${QUBOT_PORT:-/dev/ttyACM0}:${QUBOT_PORT:-/dev/ttyACM0}  # Qubot port (set QUBOT_PORT env var to override)
      - ${SATORIUS_PORT:-/dev/ttyUSB0}:${SATORIUS_PORT:-/dev/ttyUSB0}  # Satorius port (set SATORIUS_PORT env var to override)
    # Mount host .env so config updates apply after recreate (see main.py Config).
    # Compose still reads this file for ${QUBOT_PORT} / ${SATORIUS_PORT} substitution above.
    volumes:
      - ./.env:/app/first-edge/.env:ro
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
