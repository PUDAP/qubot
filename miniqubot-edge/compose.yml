name: miniqubot-edge

services:
  miniqubot-edge:
    build:
      context: ..
      dockerfile: miniqubot-edge/Dockerfile
    image: ghcr.io/pudap/miniqubot-edge:0.1.0
    container_name: miniqubot-edge
    restart: unless-stopped
    environment:
      NATS_SERVERS: ${NATS_SERVERS:?required}
      MACHINE_ID: ${MACHINE_ID:?required}
      QUBOT_PORT: /dev/ttyUSB0
      HOME_ON_STARTUP: ${HOME_ON_STARTUP:-true}
      PUDA_NATS_CA: "${PUDA_NATS_CA:+/run/puda-ca/ca.pem}"
      PUDA_E2E_KEY_FILE: "${PUDA_E2E_KEY_FILE:+/run/puda-key/e2e.key}"
    volumes:
      - type: bind
        source: ${PUDA_NATS_CA:-/dev/null}
        target: /run/puda-ca/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PUDA_E2E_KEY_FILE:-/dev/null}
        target: /run/puda-key/e2e.key
        read_only: true
        bind:
          create_host_path: false
    devices:
      - source: "${MINIQUBOT_HOST_DEVICE:?required}"
        target: /dev/ttyUSB0
        permissions: rwm
    group_add:
      - "${MINIQUBOT_DIALOUT_GID:?required}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - puda-active

networks:
  puda-active:
    external: true
    name: puda-active
