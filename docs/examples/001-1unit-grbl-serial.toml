# Example contract for gantry 001-1unit-grbl-serial.
# Used as: miniqubot.
# Reference values only. A site edge copies this to contracts/<version>.toml,
# fills every blank, and keeps machine_id and the port env names from its
# .env.example.
#

version = "1"
machine_id = ""
gantry = "001-1unit-grbl-serial"
effectors = []
home_on_startup = ""
soft_limits = "none"

[frame]
axes = ["X", "Y", "Z"]
hardware_limits = { X = [0.0, 175.0], Y = [-190.0, 0.0], Z = [-75.0, 0.0] }
default_deck = { rows = 2, cols = 2 }
expected_identity = "[VER:1.1h.20190830:]"
required_settings = { "20" = 1.0, "21" = 1.0, "22" = 1.0, "23" = 1.0, "130" = 175.0, "131" = 190.0, "132" = 75.0 }

# Safety text and confirm are filled per edge.
[commands.home]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

[commands.move_absolute]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

