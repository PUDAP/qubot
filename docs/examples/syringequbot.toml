# Example contract for syringequbot, on gantry 002-1unit-reprap-http.
# Used as: capper, then syringequbot.
# Reference values only. A site edge copies this to contracts/<version>.toml,
# fills every blank, and keeps machine_id and the port env names from its
# .env.example.
#
# The RepRap HTTP driver includes `set_pin`.
# Firmware travel is X 0 to 140, Y -170 to 0, Z -175 to 0. A later observation
# that Z past -125 meets the current vial holder is not stored as a limit.

version = "1"
machine_id = ""
gantry = "002-1unit-reprap-http"
effectors = ["autosampler-syringe"]
home_on_startup = ""
soft_limits = "none"

# Syringe plus the current IMRE vial holder, not the needle alone. Travel past
# Z = -125 was observed to knock the needle into the base of the mounted vial
# holder (-175 firmware Z + 50). Clearance figure, not an axis limit. Remeasure
# if the vial holder changes.
syringe_length_mm = 50

[frame]
axes = ["X", "Y", "Z"]
hardware_limits = { X = [0.0, 140.0], Y = [-170.0, 0.0], Z = [-175.0, 0.0] }
default_deck = { rows = 2, cols = 2 }

# Safety text and confirm are filled per edge.
[commands.home]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

[commands.move_to]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

[commands.safe_move_to]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

[commands.reset]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""
