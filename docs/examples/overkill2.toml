# Example contract for overkill2, on gantry 007-2unit-grblhal-serial.
# Used as: Overkill2 (liquid handling, pipette gantry).
# Reference values only. A site edge copies this to contracts/<version>.toml,
# fills every blank, and keeps machine_id and the port env names from its
# .env.example.
#
# Overkill2 (Liquid handling - pipette gantry). Limits key: `pipQubot`.
# Frame travel is X −176 to 0, Y −480 to 0, Z −190 to 0. The frame is 2 by 1
# units, so X may travel at most 300 mm and Y at most 600 mm. The uploaded spans
# are 176 mm and 480 mm, both inside that allowance.

version = "1"
machine_id = ""
gantry = "007-2unit-grblhal-serial"
effectors = ["rline-50-1000-multistep"]
home_on_startup = ""
soft_limits = "none"

[frame]
axes = ["X", "Y", "Z"]
hardware_limits = { X = [-176, 0], Y = [-480, 0], Z = [-190, 0] }
default_deck = { rows = 4, cols = 2 }

# Safety text and confirm are filled per edge.
[commands.home]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

[commands.move_absolute]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

[commands.move_relative]
summary = ""
hazards = []
requires = ""
forbidden_when = ""
confirm = ""

# Serial port env: SATORIUS_PORT. Axis: Z.
# step_resolution and response_time_s are the PESCador pipette calibration.
[effector.rline-50-1000-multistep]
model = "50-1000"
minimum_volume_ul = 50
maximum_volume_ul = 1000
microliters_per_step = 2.5
step_resolution = 10
response_time_s = 1.03
